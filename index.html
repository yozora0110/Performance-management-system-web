<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成發表演曲目管理系統</title><link rel="stylesheet" href="style.css"></head><body><aside><div class="brand">♫ 成發管理系統<small>PERFORMANCE MANAGER</small></div><nav id="nav"></nav><div class="sidefoot">本機資料管理 · Web v1.3</div></aside><main><header><div><small>活動管理 / <span id="crumb"></span></small><h1 id="heading"></h1></div><button id="theme">◐ 切換主題</button></header><section id="stats" class="stats"></section><section id="content"></section><footer>資料僅儲存於目前瀏覽器，不會上傳伺服器。</footer></main><dialog id="editor"><form id="editForm"><h2 id="editTitle">編輯曲目</h2><label>團體名稱<input name="group" required></label><label>曲目名稱<input name="song" required></label><label>歌曲類型<select name="type"><option>未分類</option><option>幹部舞</option><option>大群歌</option><option>老人舞</option></select></label><label>原定人數<input name="count" type="number" min="1" max="100000" required></label><label>報名名單（以頓號或換行分隔）<textarea name="members" rows="4"></textarea></label><div class="actions"><button type="button" id="cancel">取消</button><button class="primary">儲存</button></div></form></dialog><div id="toast" role="status"></div><script src="script.js"></script></body></html>
